# ======================================================================================================================
# Filebeat inputs
# ======================================================================================================================

filebeat.inputs:

  - type: filestream
    id: microservices-logs
    enabled: true

    paths:
      - /logs/*/*.log

    parsers:
      - ndjson:
          overwrite_keys: true
          add_error_key: true
          expand_keys: true

# ======================================================================================================================
# Processors
# ======================================================================================================================

processors:
  - add_host_metadata: ~
  - add_docker_metadata: ~

# ======================================================================================================================
# Elasticsearch
# ======================================================================================================================

output.elasticsearch:
  hosts:
    - "http://elasticsearch:9200"

  username: "elastic"
  password: "1234567"

# ======================================================================================================================
# Kibana
# ======================================================================================================================

setup.kibana:
  host: "http://kibana:5601"

  username: "elastic"
  password: "1234567"